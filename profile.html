<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Profile | eFootball Tournament</title>
  <meta name="description" content="View your player profile and tournament statistics.">
  <meta name="theme-color" content="#04070f">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="profile" data-page-title="My Profile">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main" class="container-ef pt-10 sm:pt-14">
    <header class="reveal">
      <span class="eyebrow eyebrow--volt">Player portal</span>
      <h1 class="page-title mt-3">My <span class="text-gradient">Profile</span></h1>
      <p class="text-muted mt-3 max-w-2xl">Sign in with the email address used for your player registration to update your eFootball username and view your tournament stats.</p>
    </header>
    <section id="profile-content" class="glass mt-8 p-5 sm:p-7" aria-live="polite">
      <div class="state" role="status"><span class="spinner"></span><p class="text-sm text-muted mt-3">Loading your profile…</p></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/core/utils.js"></script>
  <script src="assets/js/core/local-db.js"></script>
  <script src="assets/js/core/google-script.js"></script>
  <script src="assets/js/core/supabase.js"></script>
  <script src="assets/js/core/ui.js"></script>
  <script src="assets/js/core/standings.js"></script>
  <script src="assets/js/core/api.js"></script>
  <script src="assets/js/core/layout.js"></script>
  <script src="assets/js/components/registration.js"></script>
  <script src="assets/js/pages/profile.js"></script>
</body>
</html>
